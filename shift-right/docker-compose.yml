services:
  # ==============================================================================
  # 1. BASE DE DONNÉES APPLICATION (MySQL 8.4)
  # ==============================================================================
  mysql:
    image: mysql:8.4
    container_name: campus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: campus_enrollment_db
      MYSQL_USER: campus_user
      MYSQL_PASSWORD: campus_password
    volumes:
      - campus_mysql_data:/var/lib/mysql
      - ../docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - shift-right-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==============================================================================
  # 2. BASE DE DONNÉES UNLEASH (PostgreSQL 15)
  # ==============================================================================
  unleash-db:
    image: postgres:15-alpine
    container_name: campus-unleash-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash_user
      POSTGRES_PASSWORD: unleash_password
    volumes:
      - campus_unleash_pg_data:/var/lib/postgresql/data
    networks:
      - shift-right-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash_user -d unleash"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==============================================================================
  # 3. SERVEUR UNLEASH (Feature Flags & Kill Switch Engine)
  # ==============================================================================
  unleash-server:
    image: unleashorg/unleash-server:latest
    container_name: campus-unleash-server
    restart: unless-stopped
    depends_on:
      unleash-db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://unleash_user:unleash_password@unleash-db:5432/unleash"
      DATABASE_SSL: "false"
      LOG_LEVEL: "warn"
      AUTH_TYPE: "none"
      INIT_CLIENT_API_TOKENS: "*:production.be4436eb09f3a04a0d2447e180efdc35bedfc86e84b9d800fa77d169"
      INIT_FRONTEND_API_TOKENS: "*:production.frontend-token-12345"
      INIT_ADMIN_API_TOKENS: "*:*.campus-admin-token-secret-2026"
      UNLEASH_SECRET: "campus-unleash-secret-key-2026-sigl"
    ports:
      - "4242:4242"
    networks:
      - shift-right-net

  # ==============================================================================
  # 4. INSTANCE APPLICATIVE STABLE V1 (90% du trafic public)
  # ==============================================================================
  app-stable:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: campus-app-stable-v1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      unleash-server:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_VERSION: "v1.0.0-stable"
      RELEASE_TYPE: "STABLE"
      DB_HOST: "mysql"
      DB_USER: "campus_user"
      DB_PASSWORD: "campus_password"
      DB_NAME: "campus_enrollment_db"
      JWT_SECRET: "jwt_secret_campus_stable_2026"
      ENABLE_UNLEASH: "true"
      UNLEASH_URL: "http://unleash-server:4242/api"
      UNLEASH_API_TOKEN: "*:production.be4436eb09f3a04a0d2447e180efdc35bedfc86e84b9d800fa77d169"
    networks:
      - shift-right-net

  # ==============================================================================
  # 5. INSTANCE APPLICATIVE CANARY V2 (10% du trafic public / Candidate)
  # ==============================================================================
  app-canary:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: campus-app-canary-v2
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      unleash-server:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      APP_VERSION: "v2.0.0-canary"
      RELEASE_TYPE: "CANARY"
      DB_HOST: "mysql"
      DB_USER: "campus_user"
      DB_PASSWORD: "campus_password"
      DB_NAME: "campus_enrollment_db"
      JWT_SECRET: "jwt_secret_campus_canary_2026"
      ENABLE_UNLEASH: "true"
      UNLEASH_URL: "http://unleash-server:4242/api"
      UNLEASH_API_TOKEN: "*:production.be4436eb09f3a04a0d2447e180efdc35bedfc86e84b9d800fa77d169"
    networks:
      - shift-right-net

  # ==============================================================================
  # 6. ROUTEUR CANARY & REVERSE PROXY (Nginx avec split_clients)
  # ==============================================================================
  nginx-router:
    image: nginx:1.27-alpine
    container_name: campus-canary-router
    restart: unless-stopped
    depends_on:
      - app-stable
      - app-canary
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx:/etc/nginx/configs:ro
      - ./nginx/html:/usr/share/nginx/html:ro
    networks:
      - shift-right-net

networks:
  shift-right-net:
    name: campus-shift-right-network
    driver: bridge

volumes:
  campus_mysql_data:
    name: campus_shift_right_mysql
  campus_unleash_pg_data:
    name: campus_shift_right_unleash_pg
