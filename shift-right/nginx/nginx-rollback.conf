events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;

    upstream backend_stable {
        server app-stable:5000 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name _;

        location /canary-status {
            default_type application/json;
            return 200 '{"service": "nginx-canary-router", "state": "ROLLED_BACK", "ratio": "100% Stable / 0% Canary", "message": "Canary défaillant coupé, trafic redirigé à 100% vers Stable"}\n';
        }

        location /health {
            proxy_pass http://backend_stable/health;
        }

        location /api/ {
            proxy_pass http://backend_stable;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            add_header X-Served-By-Upstream $upstream_addr always;
            add_header X-Canary-Pool "backend_stable" always;
            add_header X-Shift-Right-State "ROLLED_BACK_TO_STABLE" always;
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
