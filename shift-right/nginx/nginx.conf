events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # 1. Définition des Upstreams Applicatifs
    upstream backend_stable {
        server app-stable:5000 max_fails=3 fail_timeout=5s;
    }

    upstream backend_canary {
        server app-canary:5000 max_fails=3 fail_timeout=5s;
    }

    # 2. Répartition statistique du trafic (Shift-Right Progressive Routing)
    # 90% du trafic public va vers la version Stable V1
    # 10% du trafic est routé vers la version Canary V2
    split_clients "${remote_addr}${http_user_agent}${msec}" $split_target {
        90%     backend_stable;
        *       backend_canary;
    }

    # 3. Mécanisme de Contournement (Header Override pour QA / SRE)
    # Si le header 'X-Canary: always' est présent, route à 100% vers le Canary
    # Si 'X-Canary: never', force la version Stable
    map $http_x_canary $upstream_choice {
        "always"    backend_canary;
        "never"     backend_stable;
        default     $split_target;
    }

    server {
        listen 80;
        server_name _;

        # Format de journalisation enrichi pour le Shift-Right Testing
        log_format canary_log '$remote_addr - $remote_user [$time_local] "$request" '
                              'Status: $status Size: $body_bytes_sent '
                              'Upstream: $upstream_addr TargetPool: $upstream_choice '
                              'Duration: ${request_time}s';

        access_log /var/log/nginx/access.log canary_log;
        error_log  /var/log/nginx/error.log warn;

        # Endpoint de statut du routeur Canary
        location /canary-status {
            default_type application/json;
            return 200 '{"service": "nginx-canary-router", "strategy": "split_clients", "ratio": "90% Stable / 10% Canary", "headerOverride": "X-Canary: always", "status": "ACTIVE"}\n';
        }

        # Proxy vers les instances d'application
        location / {
            proxy_pass http://$upstream_choice;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Original-URI $request_uri;

            # En-têtes injectés dans la réponse pour traçabilité Shift-Right
            add_header X-Served-By-Upstream $upstream_addr always;
            add_header X-Canary-Pool $upstream_choice always;
            add_header X-Shift-Right-Router "Nginx-Canary-v1" always;
        }
    }
}
